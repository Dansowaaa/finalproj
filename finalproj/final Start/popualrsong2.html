<img src="img/smile.png" alt="pink" class="songs">

<div class="songsorlyrics">
    <b><button id="songs" style="font-size: 90%;">Music Video</button></b>
    <b><p style="color: rgb(156, 150, 39); font-size: 50px; margin: 0; margin-top: -17px; margin-left: 7px;">|</p></b>
    <b><button id="lyrics" style="font-size: 90%;">Lyrics and Audio</button></b>
</div>

<div id="video-container"></div>

<script>
document.getElementById('songs').addEventListener('click', function() {
    const videoContainer = document.getElementById('video-container');
    if (videoContainer.innerHTML === "") {
        videoContainer.innerHTML = `
            <div class="video-wrapper">
                <iframe 
                    src="https://www.youtube.com/embed/RVDCeVG90Rg?autoplay=1" 
                    title="Die With A Smile Music Video" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen>
                </iframe>
            </div>
        `;
    } else {
        videoContainer.innerHTML = "";
    }
});
</script>
