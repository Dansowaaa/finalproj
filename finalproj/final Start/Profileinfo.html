<body>

<div class="search">

  <div style="background-color:#385973 ;">

        </label>
        
        <img id="preview" alt="Image preview" class="preview-image">

      </div>
      
    </div>
    <h2 style="background-color: #8B8C89; padding: 5px; width: 90%;"> Display or Hide Name</h2>
    <h2 style="background-color: #8B8C89; padding: 5px; width: 90%;"> Nickname</h2>

  <div style="background-color:#385973 ;">
  <h2 style="color: #AC9834; background-color: #093150; padding: 5px; width: 90%">Personal Details</h2>  
    <h2 style="background-color: #8B8C89; padding: 5px; width: 90%;"> Full Name</h2>

  <h2 style="color: #AC9834; background-color: #093150; padding: 5px; width: 90%;">Preferences & Location</h2>

  <div class="navbar">
    <a href="music1.html"><img src="img/homeicon.png" alt="Home" class="nav-icon" >Home</a>

    <a href="settings.html" class="active"><img src="img/settingsicon.png" alt="Settings" class="nav-icon">Settings</a>
  </div> 
</div>
</div>

<script>
  const fileInput = document.getElementById('photo-upload');
  const uploadZone = document.getElementById('upload-zone');
  const previewImage = document.getElementById('preview');
  const submitBtn = document.getElementById('submit-btn');

  // Trigger preview when file selection alters
  fileInput.addEventListener('change', function() {
    processFiles(this.files);
  });

  // Drag and drop states interacting with your CSS .dragover rules
  ['dragenter', 'dragover'].forEach(eventName => {
    uploadZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    }, false);
  });

  ['dragleave', 'drop'].forEach(eventName => {
    uploadZone.addEventListener(eventName, (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
    }, false);
  });

  uploadZone.addEventListener('drop', (e) => {
    const dt = e.dataTransfer;
    const files = dt.files;
    fileInput.files = files; 
    processFiles(files);
  });

  // Reads image data and displays preview element
  function processFiles(files) {
    const file = files[0];
    if (file && file.type.startsWith('image/')) {
      const reader = new FileReader();
      reader.onload = function(e) {
        previewImage.src = e.target.result;
        previewImage.classList.add('show'); // Activates your CSS slideIn rule
        if (submitBtn) submitBtn.disabled = false; // Enables your upload button
      }
      reader.readAsDataURL(file);
    }
  }
</script>
<script src="script.js"></script>
</body>
</html>
